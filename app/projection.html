<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projection — Étonnamment d'accord</title>
  <meta name="robots" content="noindex, nofollow" />

  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Londrina+Solid:wght@300;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared/base.css" />

  <style>
    /* Cette page tourne sur le navigateur du vidéoprojecteur, en plein écran,
       vue de loin. Tout est surdimensionné et rien ne défile. */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 100vh;
      overflow: hidden;
      cursor: none;
    }
    .stageview { padding: 4vh 4vw; }
    .kicker {
      font-size: clamp(16px, 2vw, 26px);
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-bottom: 2vh;
    }
    .headline {
      font-family: "Londrina Solid", sans-serif;
      font-weight: 900;
      font-size: clamp(48px, 11vw, 190px);
      line-height: 1.02;
      margin: 0;
    }
    .sub { font-size: clamp(18px, 2.4vw, 34px); color: var(--ink-muted); margin-top: 3vh; }
    .stage-art { display: block; max-width: min(560px, 55vw); max-height: 54vh; width: auto; height: auto; margin: 4vh auto 0; }
    .stage-art[hidden] { display: none; }
    /* Le QR occupe moins de hauteur que island/feedback : « Bienvenue » est
       le plus long des titres (deux lignes), donc celui qui laisse le moins
       de place en dessous avant de sortir du cadre (page en overflow:hidden,
       rien ne doit défiler). Mesuré : sans ce plafond, le QR déborde de
       ~190px sur 900px de haut. */
    .stage-art--qr { max-width: min(380px, 40vw); max-height: 28vh; }
    /* Idem pour la clôture : mesuré à 702px (78vh) de haut, le bloc titre +
       image dépassait le cadre de ~150px. 56vh est le maximum qui tient
       sans déborder avec « MERCI / À bientôt » — nettement plus grand que
       la base (54vh), mais pas le facteur 3 demandé : le titre ne laisse
       pas la place. Voir la note pour Paul. */
    .stage-art--feedback { max-height: 56vh; }

    /* ---- miroir de la mission d'entrée ---- */
    #entryview { display: none; width: min(1500px, 92vw); }
    #entryview.is-active { display: block; }
    .stageview.is-hidden { display: none; }

    .eq {
      font-family: "Londrina Solid", sans-serif;
      font-weight: 900;
      font-size: clamp(26px, 3.6vw, 62px);
      line-height: 1.12;
      margin: 0 0 5vh;
      text-align: left;
    }
    .bars { display: grid; gap: clamp(10px, 1.8vh, 26px); text-align: left; }
    .bar-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 3vw;
    }
    .bar-label { font-size: clamp(16px, 1.9vw, 34px); margin-bottom: .5vh; }
    .bar-track { height: clamp(14px, 2.4vh, 34px); background: #F3E7D6; border-radius: 999px; overflow: hidden; }
    .bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 999px;
      /* La barre s'anime : dans une salle, le mouvement dit « c'est en direct ». */
      transition: width .6s cubic-bezier(.22,.61,.36,1);
    }
    .bar-n {
      font-family: "Londrina Solid", sans-serif;
      font-weight: 900;
      font-size: clamp(24px, 3vw, 54px);
      min-width: 2.5ch;
      text-align: right;
    }
    .etotal {
      margin-top: 5vh;
      font-size: clamp(16px, 1.8vw, 30px);
      color: var(--ink-muted);
      text-align: left;
    }

    /* ---- Pol' quiz ---- affiché quand stage = polquiz, pas via un bouton
       « vue » de la régie (contrairement à entryview/voteview) : il n'y a
       aucune raison de préférer le titre générique pendant cette phase. */
    #polquizview { display: none; width: min(1200px, 90vw); text-align: left; }
    #polquizview.is-active { display: block; }
    #pqIntro, #pqQuestion, #pqReveal, #pqRankingView { display: none; }
    #pqIntro.is-active, #pqQuestion.is-active, #pqReveal.is-active, #pqRankingView.is-active { display: block; }

    .pq-intro-text {
      font-size: clamp(22px, 3.2vw, 46px);
      line-height: 1.35;
      max-width: 36ch;
    }
    .pq-category {
      font-size: clamp(14px, 1.5vw, 24px);
      color: var(--ink-muted);
      margin-bottom: 1.5vh;
    }
    .pq-qtext {
      font-family: "Londrina Solid", sans-serif;
      font-weight: 900;
      font-size: clamp(28px, 3.6vw, 58px);
      line-height: 1.15;
      margin: 0 0 2.5vh;
    }
    .pq-countdown {
      font-family: "Londrina Solid", sans-serif;
      font-weight: 900;
      font-size: clamp(30px, 4vw, 60px);
      color: var(--accent);
      margin-bottom: 2.5vh;
    }
    .pq-opts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.2vh 2vw;
    }
    .pq-opt {
      font-size: clamp(16px, 1.9vw, 32px);
      padding: 1.4vh 1.4vw;
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }
    .pq-opt.correct {
      border-color: var(--ok);
      border-width: 3px;
      background: color-mix(in srgb, var(--ok) 14%, transparent);
      font-weight: 700;
    }
    .pq-explanation { font-size: clamp(16px, 1.9vw, 32px); line-height: 1.35; margin: 2.5vh 0 1vh; max-width: 60ch; }
    .pq-source { font-size: clamp(12px, 1.2vw, 20px); color: var(--ink-muted); }

    .pq-rank-row {
      display: flex;
      justify-content: space-between;
      gap: 2vw;
      font-size: clamp(18px, 2.4vw, 40px);
      padding: 1vh 0;
      border-bottom: 1px solid var(--line);
      max-width: 50ch;
    }
    .pq-rank-row:first-child { font-family: "Londrina Solid", sans-serif; font-weight: 900; }

    /* ---- résultats du vote ---- */
    #voteview { display: none; width: min(1600px, 94vw); }
    #voteview.is-active { display: block; }

    .vrow { text-align: left; margin-bottom: clamp(14px, 2.6vh, 34px); }
    .vtext {
      font-size: clamp(17px, 2.1vw, 38px);
      line-height: 1.22;
      margin-bottom: 1vh;
    }
    /* Barre empilée : d'accord | motus | pas d'accord. La longueur des trois
       segments dit la répartition, leur ordre reste le même d'une ligne à
       l'autre pour qu'on puisse comparer les lignes d'un coup d'œil. */
    .vbar {
      display: flex;
      height: clamp(16px, 2.6vh, 38px);
      border-radius: 999px;
      overflow: hidden;
      background: #F3E7D6;
    }
    .vbar span { transition: width .6s cubic-bezier(.22,.61,.36,1); }
    .v-agree    { background: var(--ok); }
    .v-neutral  { background: #D99F6B; }
    .v-disagree { background: var(--accent); }

    .vmeta {
      display: flex;
      gap: 2.2vw;
      font-size: clamp(13px, 1.35vw, 24px);
      color: var(--ink-muted);
      margin-top: .7vh;
    }
    /* Deuxième temps : le résumé IA n'apparaît qu'une fois généré par la
       régie, en direct via `session.text_summary` (pas de nouvel écran). */
    #vsummary { display: none; margin-top: 4vh; padding-top: 3vh; border-top: 1px solid var(--line); text-align: left; }
    #vsummary.is-active { display: block; }
    #vsummary p { font-size: clamp(18px, 2.2vw, 36px); line-height: 1.35; margin: 0; }

    .vfoot {
      margin-top: 3vh;
      font-size: clamp(14px, 1.5vw, 26px);
      color: var(--ink-muted);
      text-align: left;
      display: flex;
      justify-content: space-between;
    }
    .vlegend { display: flex; gap: 1.6vw; }
    .vlegend i { display: inline-block; width: 1em; height: 1em; border-radius: 3px; vertical-align: -.1em; margin-right: .4em; }

    /* Le bandeau de connexion ne doit jamais masquer le contenu projeté :
       sur grand écran il devient un simple liseré en bas. */
    .conn {
      top: auto; bottom: 0;
      transform: translateY(100%);
      font-size: 15px;
    }
    .conn[data-status="offline"],
    .conn[data-status="connecting"] { transform: none; }
  </style>
</head>
<body>
  <div class="conn" id="conn"></div>

  <div class="stageview" id="stageview">
    <div class="kicker" id="kicker">Étonnamment d'accord</div>
    <h1 class="headline" id="headline">…</h1>
    <div class="sub" id="sub"></div>
    <img class="stage-art" id="stageArt" src="" alt="" hidden />
  </div>

  <div id="entryview">
    <div class="kicker">Mission d'entrée</div>
    <h2 class="eq" id="eq"></h2>
    <div class="bars" id="bars"></div>
    <div class="etotal" id="etotal"></div>
  </div>

  <div id="polquizview">
    <div class="kicker" id="pqKicker">Pol’ quiz</div>

    <div id="pqIntro">
      <p class="pq-intro-text" id="pqIntroText"></p>
    </div>

    <div id="pqQuestion">
      <div class="pq-category" id="pqCategory"></div>
      <h2 class="pq-qtext" id="pqQtext"></h2>
      <div class="pq-countdown" id="pqCountdown"></div>
      <div class="pq-opts" id="pqOpts"></div>
    </div>

    <div id="pqReveal">
      <div class="pq-category" id="pqRevealCategory"></div>
      <h2 class="pq-qtext" id="pqRevealQtext"></h2>
      <div class="pq-opts" id="pqRevealOpts"></div>
      <p class="pq-explanation" id="pqExplanation"></p>
      <p class="pq-source" id="pqSource"></p>
    </div>

    <div id="pqRankingView">
      <div class="kicker">Classement des tablées</div>
      <div id="pqRankRows"></div>
    </div>
  </div>

  <div id="voteview">
    <!-- Le classement va du plus consensuel au plus clivant, et « consensuel »
         inclut l'accord POUR comme l'accord CONTRE : un énoncé rejeté à
         l'unanimité est consensuel. Titrer « ce sur quoi vous êtes d'accord »
         mettrait donc en tête, sous ce titre, des énoncés que la salle rejette.
         Les couleurs de la barre disent le sens ; le titre dit l'axe. -->
    <div class="kicker" id="vkicker">Du plus consensuel au plus clivant</div>
    <div id="vrows"></div>
    <div class="vfoot">
      <div class="vlegend">
        <span><i class="v-agree"></i>d'accord</span>
        <span><i class="v-neutral"></i>motus</span>
        <span><i class="v-disagree"></i>pas d'accord</span>
      </div>
      <div id="vpage"></div>
    </div>
    <div id="vsummary">
      <div class="kicker">Ce qui ressort</div>
      <p id="vsummaryText"></p>
    </div>
  </div>

  <script src="shared/pocketbase.umd.js"></script>
  <script src="shared/questions.js"></script>
  <script src="shared/app.js"></script>
  <script>
    // Étape 1 : la projection ne fait que refléter `stage`. Les agrégats
    // (entry_results, vote_results) arrivent aux étapes 3 et 6.
    var VUES = {
      accueil:      { kicker: 'Bienvenue',        head: 'Étonnamment d’accord', sub: 'La soirée va commencer' },
      mission:      { kicker: 'Mission d’entrée', head: 'Sortez votre téléphone', sub: 'app.etonnamment.fr' },
      consigne:     { kicker: 'Rencontre',        head: 'Trouvez quelqu’un qui…', sub: '' },
      ilots:        { kicker: 'Îlots',            head: 'Rejoignez votre îlot',   sub: '' },
      polquiz:      { kicker: 'Pol’ quiz',        head: 'Répondez en îlot',       sub: 'Sur votre téléphone' },
      propositions: { kicker: 'Propositions',     head: 'À vous d’écrire',      sub: 'Deux propositions par îlot' },
      vote:         { kicker: 'Vote',             head: 'Votez',                  sub: 'Sur votre téléphone' },
      resultats:    { kicker: 'Résultats',        head: 'Ce sur quoi vous êtes (étonnamment!) d’accord', sub: '' },
      cloture:      { kicker: 'Merci',            head: 'À bientôt',              sub: '' }
    };

    var conn = document.getElementById('conn');
    var kicker = document.getElementById('kicker');
    var headline = document.getElementById('headline');
    var sub = document.getElementById('sub');
    var stageArt = document.getElementById('stageArt');

    // Illustration du stage courant. Pour « ilots », plusieurs images
    // tournent pendant que la salle se déplace — un écran qui bouge un peu
    // pendant qu'on cherche sa table.
    var ISLAND_ART = ['assets/Island 1.png', 'assets/Island 2.png', 'assets/Island 3.png'];
    var islandArtTimer = null;
    var lastArtStage = null;

    function stopIslandArt() {
      if (islandArtTimer) { clearInterval(islandArtTimer); islandArtTimer = null; }
    }

    function startIslandArt() {
      var i = 0;
      stageArt.src = ISLAND_ART[i];
      stageArt.hidden = false;
      stopIslandArt();
      islandArtTimer = setInterval(function () {
        i = (i + 1) % ISLAND_ART.length;
        stageArt.src = ISLAND_ART[i];
      }, 4000);
    }

    function updateStageArt(stage) {
      if (stage === lastArtStage) return;
      lastArtStage = stage;
      stageArt.classList.remove('stage-art--feedback', 'stage-art--qr');
      if (stage === 'accueil') {
        stopIslandArt();
        stageArt.src = 'assets/QR_code.png';
        stageArt.classList.add('stage-art--qr');
        stageArt.hidden = false;
      } else if (stage === 'ilots') {
        startIslandArt();
      } else if (stage === 'cloture') {
        stopIslandArt();
        stageArt.src = 'assets/feedback.png';
        stageArt.classList.add('stage-art--feedback');
        stageArt.hidden = false;
      } else {
        stopIslandArt();
        stageArt.hidden = true;
      }
    }

    App.onStatus(function (status) {
      conn.dataset.status = status;
      // Sur grand écran on n'affiche jamais d'erreur brutale : on signale
      // discrètement, et le dernier état connu reste à l'écran (spec §7).
      conn.textContent = status === 'offline'
        ? 'Reconnexion en cours — affichage figé sur le dernier état connu'
        : 'Connexion…';
    });

    /* ---- Miroir de la mission d'entrée ------------------------------------
     * `projection_view = "entry"` bascule sur les résultats ; la régie choisit
     * la question avec `projection_question`. */
    var stageview = document.getElementById('stageview');
    var entryview = document.getElementById('entryview');
    var eq = document.getElementById('eq');
    var bars = document.getElementById('bars');
    var etotal = document.getElementById('etotal');

    var counts = {};        // "q1_c2" -> n
    var currentQuestion = 'q1';
    var participants = 0;

    function questionByKey(key) {
      for (var i = 0; i < QUESTIONS.length; i++) {
        if (QUESTIONS[i].key === key) return QUESTIONS[i];
      }
      return null;
    }

    function renderEntry() {
      var q = questionByKey(currentQuestion);
      if (!q) return;

      eq.textContent = q.text;

      var total = 0;
      q.options.forEach(function (o) { total += counts[o.key] || 0; });

      // Les barres sont relatives à l'option la plus choisie, pas au total :
      // sur une question à quatre options, tout resterait sinon écrasé en bas.
      var max = 0;
      q.options.forEach(function (o) { max = Math.max(max, counts[o.key] || 0); });

      bars.textContent = '';
      q.options.forEach(function (o) {
        var n = counts[o.key] || 0;

        var row = document.createElement('div');
        row.className = 'bar-row';

        var left = document.createElement('div');
        var label = document.createElement('div');
        label.className = 'bar-label';
        label.textContent = o.label;
        var track = document.createElement('div');
        track.className = 'bar-track';
        var fill = document.createElement('div');
        fill.className = 'bar-fill';
        fill.style.width = (max ? (n / max) * 100 : 0) + '%';
        track.appendChild(fill);
        left.appendChild(label);
        left.appendChild(track);

        var num = document.createElement('div');
        num.className = 'bar-n';
        num.textContent = n;

        row.appendChild(left);
        row.appendChild(num);
        bars.appendChild(row);
      });

      // Effectifs absolus, exigés au §1.5 du brief : « 34 personnes sur 58 ».
      etotal.textContent = participants
        ? total + ' réponse' + (total > 1 ? 's' : '') + ' — ' + participants + ' participant' + (participants > 1 ? 's' : '')
        : total + ' réponse' + (total > 1 ? 's' : '');
    }

    App.watchView('entry_results', 'entry_answers', function (rows) {
      counts = {};
      rows.forEach(function (r) { counts[r.choice] = r.n; });
      renderEntry();
    });

    App.watchView('participant_count', 'participants', function (rows) {
      participants = rows.length ? rows[0].n : 0;
      renderEntry();
    });

    /* ---- Résultats du vote ------------------------------------------------
     * Le tri se fait ICI, pas en SQL (spec §2.3) : on veut pouvoir l'ajuster
     * le soir même sans migration.
     *
     *   n    = d'accord + pas d'accord      (« motus » ne compte pas au
     *                                        dénominateur : c'est une absence
     *                                        d'avis, pas un avis médian)
     *   lean = |d'accord − pas d'accord| / n
     *
     * lean proche de 1 : la salle penche du même côté — consensuel.
     * lean proche de 0 : la salle est coupée en deux — clivant.
     * On projette du plus consensuel au plus clivant. */
    var PER_PAGE = 5;     // lisible depuis le fond de la salle

    var voteview = document.getElementById('voteview');
    var vrows = document.getElementById('vrows');
    var vpage = document.getElementById('vpage');
    var vsummary = document.getElementById('vsummary');
    var vsummaryText = document.getElementById('vsummaryText');

    var voteRows = [];
    var votePage = 0;

    function ranked() {
      var scored = voteRows.map(function (r) {
        var agree = r.agree || 0, disagree = r.disagree || 0, neutral = r.neutral || 0;
        var n = agree + disagree;
        return {
          text: r.text,
          agree: agree, neutral: neutral, disagree: disagree,
          n: n,
          lean: n ? Math.abs(agree - disagree) / n : 0
        };
      });

      return scored.sort(function (a, b) { return b.lean - a.lean; });
    }

    function renderVote() {
      var all = ranked();
      var pages = Math.max(1, Math.ceil(all.length / PER_PAGE));
      var page = Math.min(Math.max(votePage, 0), pages - 1);
      var slice = all.slice(page * PER_PAGE, page * PER_PAGE + PER_PAGE);

      vrows.textContent = '';
      slice.forEach(function (r) {
        var total = r.agree + r.neutral + r.disagree;
        var pct = function (v) { return total ? (v / total) * 100 : 0; };

        var row = document.createElement('div');
        row.className = 'vrow';

        var text = document.createElement('div');
        text.className = 'vtext';
        text.textContent = r.text;

        var bar = document.createElement('div');
        bar.className = 'vbar';
        [['v-agree', r.agree], ['v-neutral', r.neutral], ['v-disagree', r.disagree]]
          .forEach(function (pair) {
            var seg = document.createElement('span');
            seg.className = pair[0];
            seg.style.width = pct(pair[1]) + '%';
            bar.appendChild(seg);
          });

        var meta = document.createElement('div');
        meta.className = 'vmeta';
        meta.innerHTML =
          '<span>' + r.agree + ' d’accord</span>' +
          '<span>' + r.neutral + ' motus</span>' +
          '<span>' + r.disagree + ' pas d’accord</span>';

        row.appendChild(text);
        row.appendChild(bar);
        row.appendChild(meta);
        vrows.appendChild(row);
      });

      vpage.textContent = pages > 1 ? (page + 1) + ' / ' + pages : '';
    }

    /* On garde la fonction de relecture : la règle de lecture de
     * `vote_results` exige `projection_view = "vote"` (spec §4). Tant que la
     * régie n'a pas basculé, cette vue renvoie zéro ligne — et sans relecture
     * au moment de la bascule, l'écran resterait vide jusqu'au GET périodique.
     * Quinze secondes de grand écran blanc à 21h00, pendant que la salle
     * regarde. */
    var reloadVotes = App.watchView('vote_results', 'votes', function (rows) {
      voteRows = rows;
      renderVote();
    });

    /* ---- Pol' quiz ---------------------------------------------------------
     * Affiché dès que `stage === 'polquiz'` — pas de bouton « vue » régie
     * séparé comme entry/vote : il n'y a rien d'autre d'utile à montrer
     * pendant cette phase. Le contenu (question courante, phase, et le
     * classement une fois calculé) vient entièrement de `session`
     * (`polquiz_question`/`polquiz_phase`/`polquiz_ranking`) — cette page
     * n'interroge jamais `polquiz_answers` directement (spec §2.6 révisée). */
    var polquizview = document.getElementById('polquizview');
    var pqIntroEl = document.getElementById('pqIntro');
    var pqIntroTextEl = document.getElementById('pqIntroText');
    var pqQuestionEl = document.getElementById('pqQuestion');
    var pqCategoryEl = document.getElementById('pqCategory');
    var pqQtextEl = document.getElementById('pqQtext');
    var pqCountdownEl = document.getElementById('pqCountdown');
    var pqOptsEl = document.getElementById('pqOpts');
    var pqRevealEl = document.getElementById('pqReveal');
    var pqRevealCategoryEl = document.getElementById('pqRevealCategory');
    var pqRevealQtextEl = document.getElementById('pqRevealQtext');
    var pqRevealOptsEl = document.getElementById('pqRevealOpts');
    var pqExplanationEl = document.getElementById('pqExplanation');
    var pqSourceEl = document.getElementById('pqSource');
    var pqRankingViewEl = document.getElementById('pqRankingView');
    var pqRankRowsEl = document.getElementById('pqRankRows');

    var pqCountdownTimer = null;
    function stopPqCountdown() {
      if (pqCountdownTimer) { clearInterval(pqCountdownTimer); pqCountdownTimer = null; }
    }
    function startPqCountdown(startedAt) {
      stopPqCountdown();
      function tick() {
        var elapsed = Math.floor((Date.now() - startedAt) / 1000);
        var left = Math.max(0, window.POLQUIZ_COUNTDOWN - elapsed);
        pqCountdownEl.textContent = left + ' s';
      }
      tick();
      pqCountdownTimer = setInterval(tick, 1000);
    }

    function pqByKey(key) {
      for (var i = 0; i < POLQUIZ.length; i++) {
        if (POLQUIZ[i].key === key) return POLQUIZ[i];
      }
      return null;
    }

    function renderPolquizView(s) {
      pqIntroEl.classList.remove('is-active');
      pqQuestionEl.classList.remove('is-active');
      pqRevealEl.classList.remove('is-active');
      pqRankingViewEl.classList.remove('is-active');
      stopPqCountdown();

      var phase = s.polquiz_phase;
      var q = pqByKey(s.polquiz_question);

      if (phase === 'done') {
        pqRankingViewEl.classList.add('is-active');
        pqRankRowsEl.textContent = '';
        (s.polquiz_ranking || []).forEach(function (r) {
          var row = document.createElement('div');
          row.className = 'pq-rank-row';
          var isl = document.createElement('span');
          isl.textContent = 'Îlot ' + r.island;
          var score = document.createElement('span');
          score.textContent = r.correct + ' bonne(s) réponse(s)';
          row.appendChild(isl); row.appendChild(score);
          pqRankRowsEl.appendChild(row);
        });
        return;
      }

      if (!q || phase === 'idle' || !phase) {
        pqIntroEl.classList.add('is-active');
        pqIntroTextEl.textContent = window.POLQUIZ_INTRO;
        return;
      }

      if (phase === 'reveal') {
        pqRevealEl.classList.add('is-active');
        pqRevealCategoryEl.textContent = q.category || '';
        pqRevealQtextEl.textContent = q.text;
        pqRevealOptsEl.textContent = '';
        q.options.forEach(function (opt) {
          var row = document.createElement('div');
          row.className = 'pq-opt' + (opt.key === q.correct ? ' correct' : '');
          row.textContent = opt.label;
          pqRevealOptsEl.appendChild(row);
        });
        pqExplanationEl.textContent = q.explanation || '';
        pqSourceEl.textContent = q.source || '';
        return;
      }

      // phase === 'question'
      pqQuestionEl.classList.add('is-active');
      pqCategoryEl.textContent = q.category || '';
      pqQtextEl.textContent = q.text;
      if (s.polquiz_started_at) startPqCountdown(s.polquiz_started_at);
      pqOptsEl.textContent = '';
      q.options.forEach(function (opt) {
        var row = document.createElement('div');
        row.className = 'pq-opt';
        row.textContent = opt.label;
        pqOptsEl.appendChild(row);
      });
    }

    App.onSession(function (s) {
      var showEntry = s.projection_view === 'entry';
      var showVote = s.projection_view === 'vote';
      var showPolquiz = s.stage === 'polquiz';
      entryview.classList.toggle('is-active', showEntry);
      voteview.classList.toggle('is-active', showVote);
      polquizview.classList.toggle('is-active', showPolquiz);
      stageview.classList.toggle('is-hidden', showEntry || showVote || showPolquiz);
      if (showPolquiz) renderPolquizView(s);

      if (typeof s.projection_page === 'number' && s.projection_page !== votePage) {
        votePage = s.projection_page;
      }
      if (showVote) {
        renderVote();                       // d'abord ce qu'on a déjà
        if (!voteRows.length) reloadVotes(); // puis on va chercher le reste
      }

      var hasSummary = !!(s.text_summary && s.text_summary.trim());
      vsummary.classList.toggle('is-active', hasSummary);
      vsummaryText.textContent = hasSummary ? s.text_summary : '';

      if (s.projection_question && s.projection_question !== currentQuestion) {
        currentQuestion = s.projection_question;
      }
      if (showEntry) renderEntry();

      updateStageArt(s.stage);

      var v = VUES[s.stage];
      if (!v) return;              // stage inconnu : on garde l'écran précédent
      kicker.textContent = v.kicker;
      headline.textContent = v.head;
      sub.textContent = v.sub;
    });

    App.start();
  </script>
</body>
</html>
