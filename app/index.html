<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Étonnamment d'accord</title>
  <meta name="robots" content="noindex, nofollow" />

  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Beth+Ellen&family=Inter:wght@400;500;600&family=Londrina+Solid:wght@300;900&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #fff;
      --ink: #141414;
      --ink-muted: #6b6b6b;
      --accent: #ee5340;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 26px;
      padding: 40px 24px;
      text-align: center;
      background: var(--bg);
      color: var(--ink);
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .logo { width: min(76vw, 460px); height: auto; }
    .note {
      font-family: "Londrina Solid", sans-serif;
      font-weight: 300;
      font-size: clamp(18px, 2.4vw, 23px);
      line-height: 1.5;
      max-width: 34ch;
      margin: 0;
    }
    .hook {
      font-family: "Beth Ellen", cursive;
      color: var(--accent);
      font-size: clamp(20px, 3vw, 28px);
      margin: 0;
    }
    .back {
      font-size: 14px;
      font-weight: 500;
      color: var(--ink-muted);
      text-decoration: none;
      border-bottom: 1px solid #e1e1dc;
      padding-bottom: 2px;
      transition: color .15s ease, border-color .15s ease;
    }
    .back:hover { color: var(--accent); border-color: var(--accent); }
    .stamp {
      position: fixed;
      bottom: 14px;
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #b4b4ae;
    }
  </style>
</head>
<body>
  <img class="logo" src="assets/Main_Logo.png" alt="Étonnamment d'accord" />
  <p class="hook">Bientôt&nbsp;!</p>
  <p class="note">L'espace de la soirée ouvrira ici le jour J. En attendant, tout se passe sur le site.</p>
  <a class="back" href="https://etonnamment.fr">Retour au site ↗</a>

  <!-- Sert de test de déploiement : si vous voyez ce tampon, le pipeline
       rsync → Caddy fonctionne. À supprimer quand la vraie app arrive. -->
  <span class="stamp">déploiement ok</span>
</body>
</html>
