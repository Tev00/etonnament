# Netlify — sert UNIQUEMENT le site vitrine (etonnamment.fr).
#
# L'app événementielle vit dans app/ et part sur Scaleway
# (app.etonnamment.fr) via deploy-app.sh. Netlify ne la voit jamais.

[build]
  publish = "site"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
